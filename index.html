<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    /* ===== 顶部栏 ===== */
    header {
        background: #fff;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 4px rgba(0,0,0,.08);
        z-index: 10;
    }
    header h1 { font-size: 18px; color: #333; }
    .btn {
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 14px;
        transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-gray { background: #e8eaed; color: #444; }
    .btn-danger { background: #ff5c5c; color: #fff; }

    /* ===== 设置面板 ===== */
    #settingsPanel {
        display: none;
        background: #fff;
        padding: 16px 20px;
        border-bottom: 1px solid #e5e5e5;
    }
    #settingsPanel.show { display: block; }
    .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
    .form-group { flex: 1; min-width: 220px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #4f6ef7; }

    /* ===== 聊天区 ===== */
    #chatBox {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .msg { display: flex; max-width: 80%; }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 15px;
        line-height: 1.6;
        word-break: break-word;
    }
    .user .bubble { background: #4f6ef7; color: #fff; border-bottom-right-radius: 2px; }
    .assistant .bubble { background: #fff; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .bubble pre { background: #282c34; color: #e6e6e6; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
    .bubble code { font-family: Consolas, monospace; font-size: 13px; }
    .bubble p code, .bubble li code { background: #f0f0f0; color: #c7254e; padding: 1px 4px; border-radius: 3px; }
    .bubble ul, .bubble ol { padding-left: 20px; }

    /* ===== 输入区 ===== */
    footer {
        background: #fff;
        padding: 12px 20px;
        display: flex;
        gap: 10px;
        box-shadow: 0 -1px 4px rgba(0,0,0,.06);
    }
    #userInput {
        flex: 1;
        resize: none;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 15px;
        outline: none;
        max-height: 120px;
        font-family: inherit;
    }
    #userInput:focus { border-color: #4f6ef7; }
    .typing::after {
        content: '▍';
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #status { font-size: 13px; color: #999; padding: 0 20px 6px; }
</style>
</head>
<body>

<header>
    <h1>🤖 AI 对话助手</h1>
    <div>
        <button class="btn btn-danger" onclick="clearChat()">清空对话</button>
        <button class="btn btn-gray" onclick="toggleSettings()">⚙️ 设置</button>
    </div>
</header>

<div id="settingsPanel">
    <div class="form-row">
        <div class="form-group">
            <label>Base URL（API 地址）</label>
            <input id="baseUrl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input id="apiKey" type="password" placeholder="sk-...">
        </div>
        <div class="form-group">
            <label>模型名称</label>
            <input id="modelName" placeholder="gpt-4o-mini">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>系统提示词（System Prompt）</label>
            <textarea id="systemPrompt" rows="2" placeholder="你是一个有帮助的助手..."></textarea>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group" style="max-width:200px">
            <label>Temperat
