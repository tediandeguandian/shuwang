<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>竹林修行录 · 中考学习工作台</title>
<link rel="stylesheet" href="app.css?v=4">
</head>
<body>

<!-- ============ 背景装饰：水墨竹影 + 宣纸纹理（极低透明度，纯装饰） ============ -->
<div class="bg-layer bg-bamboo" aria-hidden="true">
  <svg width="100%" height="100%" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <g fill="none" style="stroke:var(--bamboo)" stroke-width="7" stroke-linecap="round">
      <path d="M120 -20 L120 920"/><path d="M120 140 h34"/><path d="M120 360 h34"/><path d="M120 600 h34"/>
      <path d="M980 -20 L975 920"/><path d="M980 200 h-34"/><path d="M980 520 h-34"/><path d="M980 760 h-34"/>
      <path d="M600 -20 C596 300 604 600 598 920" stroke-width="4" opacity=".7"/>
      <path d="M598 220 h24"/><path d="M600 520 h24"/><path d="M598 760 h24"/>
    </g>
    <g style="fill:var(--bamboo)">
      <path d="M120 130 C168 108 214 118 238 148 C196 166 148 160 120 130 Z" opacity=".85"/>
      <path d="M120 350 C160 330 202 344 224 372 C186 384 146 376 120 350 Z" opacity=".75"/>
      <path d="M980 190 C946 168 908 172 888 194 C920 214 952 212 980 190 Z" opacity=".8"/>
      <path d="M980 700 C944 682 906 690 886 712 C918 730 950 726 980 700 Z" opacity=".7"/>
      <path d="M600 210 C626 190 662 190 682 206 C654 226 622 226 600 210 Z" opacity=".6"/>
      <path d="M600 730 C630 714 664 718 682 736 C654 752 624 750 600 730 Z" opacity=".55"/>
    </g>
    <g fill="none" stroke="#C9A961" stroke-width="2" opacity=".5">
      <path d="M0 780 C120 760 200 800 320 782 C200 812 90 806 0 780 Z"/>
      <path d="M760 120 C880 100 970 140 1080 122 C960 152 850 146 760 120 Z"/>
    </g>
  </svg>
</div>
<div class="bg-layer bg-paper" aria-hidden="true"></div>

<div class="wrap">
  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="seal" id="brandSeal">修</div>
      <div>
        <h1 id="brandTitle">竹林修行录</h1>
        <p id="brandSub">九年级 · 中考备战 <span class="badge-admin">家长后台</span></p>
      </div>
    </div>
    <div class="top-right">
      <div class="countdown" title="距离中考开考">
        <b id="cdDays">--</b><span>天后 · 开考</span>
      </div>
      <button class="icon-btn cloud-btn" data-action="open-cloud" title="云同步">
        <span class="dot off" id="cloudDot"></span>
        <span class="lbl" id="cloudLbl">同步</span>
      </button>
      <button class="icon-btn" data-action="open-help" title="使用说明">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M9.4 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.1-2.6 3.7"/><path d="M12 17.4h.01"/></svg>
        <span class="lbl">说明</span>
      </button>
      <button class="icon-btn" data-action="open-settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span class="lbl">设置</span>
      </button>
    </div>
  </header>
</div>

<!-- ============ 标签导航 ============ -->
<nav id="tabbar">
  <button class="tab on" data-action="go" data-page="home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span id="tabHome">总览</span></button>
  <button class="tab" data-action="go" data-page="study"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 19.5 6 15.5l11-11a2.1 2.1 0 0 1 3 3l-11 11z"/><path d="M14.5 6.5l3 3"/><path d="M4 19.5c1.5-.5 2.5-1.5 3-3"/></svg><span id="tabStudy">习文</span></button>
  <button class="tab" data-action="go" data-page="furnace"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 3h6v4.5l4.2 8.6A2.5 2.5 0 0 1 17 20H7a2.5 2.5 0 0 1-2.2-3.9L9 7.5z"/><path d="M7.4 14h9.2"/><path d="M10.5 3h3"/></svg><span id="tabFurnace">炼丹炉</span></button>
  <button class="tab" data-action="go" data-page="record"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 5h13l-2 3 2 3H5"/><path d="M4 21h17"/></svg><span id="tabRecord">战绩</span></button>
</nav>

<!-- ============ 四个页面 ============ -->
<div class="wrap">
  <main id="app">
    <section id="page-home" class="page on"></section>
    <section id="page-study" class="page"></section>
    <section id="page-furnace" class="page"></section>
    <section id="page-record" class="page"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>


<script src="app.js?v=4"></script>
<script>boot();</script>
</body>
</html>
