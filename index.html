<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠王的小站</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- 添加marked.js库 -->
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 700px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 28px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .input-section {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #4a5568;
            font-size: 16px;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            resize: vertical;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5568' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }
        
        select:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        
        .model-section {
            margin-bottom: 25px;
        }
        
        button {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            display: block;
            margin: 25px auto;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-section {
            margin-top: 35px;
            animation: fadeIn 0.5s ease;
        }
        
        .result-section h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 20px;
        }
        
        .response {
            background: #f7fafc;
            border-left: 4px solid #4facfe;
            padding: 20px;
            margin-top: 15px;
            border-radius: 0 12px 12px 0;
            line-height: 1.6;
            color: #2d3748;
            animation: slideIn 0.3s ease;
        }
        
        /* 添加Markdown样式 */
        .response.markdown-content {
            background: white;
            border-left: 4px solid #4facfe;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .response.markdown-content h1, .response.markdown-content h2, .response.markdown-content h3 {
            margin: 1em 0 0.5em 0;
            color: #2d3748;
        }
        
        .response.markdown-content p {
            margin: 0.8em 0;
            line-height: 1.6;
        }
        
        .response.markdown-content ul, .response.markdown-content ol {
            margin: 0.8em 0;
            padding-left: 1.5em;
        }
        
        .response.markdown-content li {
            margin: 0.3em 0;
        }
        
        .response.markdown-content code {
            background-color: #f1f3f4;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }
        
        .response.markdown-content pre {
            background-color: #f8f9fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            margin: 1em 0;
        }
        
        .response.markdown-content pre code {
            background: none;
            padding: 0;
        }
        
        .response.markdown-content blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 16px;
            margin: 1em 0;
            color: #6a737d;
        }
        
        .response.markdown-content a {
            color: #4facfe;
            text-decoration: none;
        }
        
        .response.markdown-content a:hover {
            text-decoration: underline;
        }
        
        .response.markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        
        .response.markdown-content th, .response.markdown-content td {
            border: 1px solid #dfe2e5;
            padding: 8px 12px;
            text-align: left;
        }
        
        .response.markdown-content th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            color: #718096;
            padding: 20px;
            font-size: 16px;
        }
        
        .loading::after {
            content: "";
            animation: dots 1.5s infinite;
        }
        
        .error {
            color: #e53e3e;
            background-color: #fed7d7;
            border-left-color: #e53e3e;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            textarea {
                height: 120px;
            }
        }
        
        /* 添加一些装饰元素 */
        .container::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1), rgba(0, 242, 254, 0.1));
        }
        
        .container::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.05), rgba(0, 242, 254, 0.05));
        }
        
        /* 版本提示样式 */
        .version-tag {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            z-index: 1000;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- 添加版本提示 -->
    <!-- 在每次更新代码时，请更新版本号 -->
    <div class="version-tag" id="version-tag">v1.0.0</div>
    
    <div class="container">
        <h1>🤖 AI模型</h1>
        
        <div class="model-section">
            <label for="model-select">🧠 选择 AI 模型:</label>
            <select id="model-select">
                <option value="LongCat-Flash-Chat">LongCat-Flash-Chat (平衡)</option>
                <option value="LongCat-Flash-Lite" selected>LongCat-Flash-Lite (默认)</option>
                <option value="LongCat-Flash-Thinking">LongCat-Flash-Thinking (有创造力)</option>
                <option value="LongCat-Flash-Thinking-2601">LongCat-Flash-Thinking-2601 (新版)</option>
                <option value="PaddlePaddle/PaddleOCR-VL-1.5">PaddleOCR-VL-1.5 (支持图像)</option>
            </select>
        </div>
        
        <!-- 添加图像输入区域 -->
        <div class="input-section" id="image-section" style="display: none;">
            <label for="image-input">🖼️ 上传图像 (可选):</label>
            <input type="file" id="image-input" accept="image/*" style="margin-bottom: 10px;">
            <div id="image-preview" style="margin-top: 10px;"></div>
        </div>
        
        <div class="input-section">
            <label for="prompt">📝 输入您的问题或指令:</label>
            <textarea id="prompt" placeholder="例如：请帮我写一首关于春天的诗..."></textarea>
        </div>
        
        <button id="submit-btn" onclick="callAI()">
            <span>🚀 发送</span>
        </button>
        
        <div class="result-section">
            <h3>💬 AI 回复:</h3>
            <div id="response" class="response" style="display: none;"></div>
            <div id="loading" class="loading" style="display: none;">正在获取AI回复</div>
        </div>
    </div>

    <script>
        // 固定的API密钥
        const FIXED_API_KEY = "ak_2bG1gA4342JD8it0xL6Tr11G8TQ4j";
        
        // 版本信息
        const VERSION = "v1.0.1"; // 每次更新代码时请修改此版本号
        
        // 模型配置
        const MODEL_CONFIGS = {
            "LongCat-Flash-Chat": {
                max_tokens: 5000,
                temperature: 0.7,
                apiProvider: "longcat"
            },
            "LongCat-Flash-Lite": {
                max_tokens: 10000,
                temperature: 0.5,
                apiProvider: "longcat"
            },
            "LongCat-Flash-Thinking": {
                max_tokens: 8000,
                temperature: 0.9,
                apiProvider: "longcat"
            },
            "LongCat-Flash-Thinking-2601": {
                max_tokens: 8000,
                temperature: 0.3,
                apiProvider: "longcat"
            },
            "PaddlePaddle/PaddleOCR-VL-1.5": {
                max_tokens: 4096,
                temperature: 0.7,
                supportImage: true,
                apiProvider: "siliconflow"
            }
        };
        
        let currentModel = "LongCat-Flash-Lite"; // 修改默认模型为LongCat-Flash-Lite
        
        // 存储当前上传的图片
        let currentImageBase64 = null;
        
        // 页面加载完成后设置版本号
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('version-tag').textContent = VERSION;
            
            // 添加图像预览功能
            document.getElementById('image-input').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentImageBase64 = event.target.result;
                        document.getElementById('image-preview').innerHTML = 
                            `<img src="${currentImageBase64}" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 2px solid #4facfe;">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
        });
        
        async function callAI() {
            const prompt = document.getElementById('prompt').value;
            const responseDiv = document.getElementById('response');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submit-btn');
            
            // 基本验证
            if (!prompt.trim()) {
                alert('请输入问题或指令');
                return;
            }
            
            // 获取当前模型配置
            const modelConfig = MODEL_CONFIGS[currentModel];
            
            // 显示/隐藏图像输入区域
            const imageSection = document.getElementById('image-section');
            if (modelConfig.supportImage) {
                imageSection.style.display = 'block';
            } else {
                imageSection.style.display = 'none';
                currentImageBase64 = null;
                document.getElementById('image-preview').innerHTML = '';
            }
            
            // 显示加载状态
            responseDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳ 处理中...</span>';
            
            // 添加重试机制
            const maxRetries = 3;
            let retryCount = 0;
            
            while (retryCount < maxRetries) {
                try {
                    let apiUrl, headers, requestBody;
                    
                    // PaddleOCR-VL 模型 - 使用 SiliconFlow API
                    if (modelConfig.apiProvider === "siliconflow") {
                        apiUrl = 'https://api.siliconflow.cn/v1/chat/completions';
                        headers = {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer sk-tzyunnxpemyjoxxwgwynhpopwofaupijtmkrvrmkrvmdrzin`
                        };
                        
                        // 构建消息内容
                        let content;
                        if (currentImageBase64) {
                            // 有图像时使用多模态格式
                            content = [
                                {
                                    "type": "text",
                                    "text": prompt
                                },
                                {
                                    "type": "image_url",
                                    "image_url": {
                                        "url": currentImageBase64
                                    }
                                }
                            ];
                        } else {
                            // 无图像时使用纯文本
                            content = prompt;
                        }
                        
                        requestBody = {
                            "model": currentModel,
                            "messages": [
                                {
                                    "role": "user",
                                    "content": content
                                }
                            ],
                            "max_tokens": modelConfig.max_tokens,
                            "temperature": modelConfig.temperature
                        };
                    }
                    // LongCat 模型 - 使用 LongCat API
                    else {
                        apiUrl = 'https://api.longcat.chat/openai/v1/chat/completions';
                        headers = {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ak_2bG1gA4342JD8it0xL6Tr11G8TQ4j`
                        };
                        requestBody = {
                            model: currentModel,
                            messages: [
                                {
                                    role: "user",
                                    content: prompt
                                }
                            ],
                            max_tokens: modelConfig.max_tokens,
                            temperature: modelConfig.temperature
                        };
                    }
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(requestBody)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // 成功获取响应，使用marked解析Markdown内容
                        const markdownContent = data.choices[0].message.content;
                        const htmlContent = marked.parse(markdownContent);
                        responseDiv.innerHTML = `<strong>使用的模型: ${currentModel}</strong><br><br><div class="markdown-content">${htmlContent}</div>`;
                        responseDiv.classList.remove('error');
                        break; // 成功后跳出循环
                    } else if (response.status === 429) {
                        // 处理429错误
                        retryCount++;
                        console.warn(`收到429错误，第${retryCount}次重试`);
                        if (retryCount < maxRetries) {
                            // 等待一段时间后重试
                            await new Promise(resolve => setTimeout(resolve, 1000 * retryCount));
                        } else {
                            responseDiv.innerHTML = `❌ 请求过于频繁，请稍后再试 (状态码: ${response.status})`;
                            responseDiv.classList.add('error');
                        }
                    } else {
                        // 其他API错误
                        console.error('API Error:', data);
                        responseDiv.innerHTML = `❌ 错误: ${data.error?.message || '请求失败'} (状态码: ${response.status})`;
                        responseDiv.classList.add('error');
                        break; // 非429错误直接跳出循环
                    }
                    
                } catch (error) {
                    // 网络或其他错误
                    console.error('Network Error:', error);
                    responseDiv.innerHTML = `🌐 网络错误: ${error.message}`;
                    responseDiv.classList.add('error');
                    break; // 出现网络错误时跳出循环
                }
            }
            
            // 恢复界面状态
            loadingDiv.style.display = 'none';
            responseDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>🚀 发送</span>';
        }
        
        // 添加模型选择变化的事件监听器
        document.getElementById('model-select').addEventListener('change', function(e) {
            currentModel = e.target.value;
            console.log('当前选择的模型:', currentModel);
            
            // 切换模型时重置图像
            const modelConfig = MODEL_CONFIGS[currentModel];
            const imageSection = document.getElementById('image-section');
            if (!modelConfig.supportImage) {
                imageSection.style.display = 'none';
                currentImageBase64 = null;
                document.getElementById('image-preview').innerHTML = '';
                document.getElementById('image-input').value = '';
            } else {
                imageSection.style.display = 'block';
            }
        });
        
        // 添加回车键提交功能
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                callAI();
            }
        });
    </script>
</body>
</html>
